{% load static %}
<div class="glass-card glass-card-hover bg-white rounded-2xl p-4 border border-slate-200/90 shadow-sm relative group hover:border-primary/40 transition-all flex flex-col justify-between">
    <div>
        <div class="w-full h-40 rounded-xl overflow-hidden mb-3 border border-slate-100 bg-slate-50 relative">
            {% if item.image %}
                <img src="{{ item.image.url }}" alt="{{ item.title }}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
            {% else %}
                <div class="w-full h-full flex items-center justify-center text-slate-300 text-3xl">
                    <i class="fa-regular fa-image"></i>
                </div>
            {% endif %}
            <span class="absolute top-2.5 left-2.5 px-2 py-0.5 text-[10px] font-bold uppercase rounded-md shadow-xs
                {% if item.type == 'lost' %}
                    bg-rose-500 text-white
                {% else %}
                    bg-emerald-500 text-white
                {% endif %}">
                {{ item.type|default:'Report'|title }}
            </span>
        </div>

        <div class="space-y-1">
            <h4 class="text-sm font-bold text-navy truncate group-hover:text-primary transition-colors">
                {{ item.title|default:'Item Name' }}
            </h4>
            <p class="text-xs text-slate-500 flex items-center gap-1 truncate">
                <i class="fa-solid fa-location-dot text-slate-400 text-[10px]"></i>
                <span>{{ item.location|default:'Location not specified' }}</span>
            </p>
            <p class="text-[11px] text-slate-400 flex items-center gap-1">
                <i class="fa-regular fa-calendar text-[10px]"></i>
                <span>{{ item.date|default:'Recently' }}</span>
            </p>
        </div>
    </div>

    <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">
        <span class="text-xs font-semibold text-slate-600 bg-slate-50 px-2 py-1 rounded-md border border-slate-200">
            {{ item.category|default:'General'|title }}
        </span>
        <a href="/items/{{ item.id|default:'1' }}/" class="text-xs font-bold text-primary hover:text-primary-dark transition-colors flex items-center gap-1">
            <span>Details</span>
            <i class="fa-solid fa-arrow-right text-[10px]"></i>
        </a>
    </div>
</div>
