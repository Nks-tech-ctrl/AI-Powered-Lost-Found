{% if page_obj.has_other_pages %}
<div class="flex items-center justify-between pt-6 border-t border-slate-200">
  <div>
    {% if page_obj.has_previous %}
      <a href="?{% if query_string %}{{ query_string }}&{% endif %}page={{ page_obj.previous_page_number }}"
         class="px-4 py-2 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-700 hover:bg-slate-50 transition-colors inline-flex items-center gap-1.5">
        <i class="fa-solid fa-chevron-left text-[10px]"></i>
        <span>Previous</span>
      </a>
    {% endif %}
  </div>
  <span class="text-xs font-semibold text-slate-500">
    Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}
  </span>
  <div>
    {% if page_obj.has_next %}
      <a href="?{% if query_string %}{{ query_string }}&{% endif %}page={{ page_obj.next_page_number }}"
         class="px-4 py-2 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-700 hover:bg-slate-50 transition-colors inline-flex items-center gap-1.5">
        <span>Next</span>
        <i class="fa-solid fa-chevron-right text-[10px]"></i>
      </a>
    {% endif %}
  </div>
</div>
{% endif %}
