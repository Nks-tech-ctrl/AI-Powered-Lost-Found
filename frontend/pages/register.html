<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/output.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"><title>Create account · FindBack</title></head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-900"><header class="border-b border-slate-200 bg-white"><div class="mx-auto flex h-18 max-w-6xl items-center justify-between px-6"><a href="../index.html" class="flex items-center gap-2"><span class="grid h-9 w-9 place-items-center rounded-lg bg-blue-600 text-white"><i class="fa-solid fa-magnifying-glass"></i></span><span class="text-lg font-bold">FindBack</span></a><p class="text-sm text-slate-600">Already a member? <a href="login.html" class="font-semibold text-blue-600">Log in</a></p></div></header>
<main class="mx-auto max-w-xl px-6 py-12 sm:py-16"><div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-9"><p class="text-sm font-semibold uppercase tracking-wider text-blue-600">Join FindBack</p><h1 class="mt-2 text-3xl font-bold tracking-tight">Create your account</h1><p class="mt-3 text-sm leading-relaxed text-slate-500">Start reporting items and reviewing potential matches in one secure place.</p>
<form class="mt-8 space-y-5" action="#" method="post"><div class="grid gap-5 sm:grid-cols-2"><div><label for="first-name" class="text-sm font-medium">First name</label><input id="first-name" name="firstName" autocomplete="given-name" required class="input mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 text-sm outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100"></div><div><label for="last-name" class="text-sm font-medium">Last name</label><input id="last-name" name="lastName" autocomplete="family-name" required class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 text-sm outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100"></div></div><div><label for="register-email" class="text-sm font-medium">Email address</label><input id="register-email" name="email" type="email" autocomplete="email" required placeholder="you@example.com" class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 text-sm outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100"></div><div><label for="new-password" class="text-sm font-medium">Password</label><input id="new-password" name="password" type="password" autocomplete="new-password" required minlength="8" aria-describedby="password-help" class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 text-sm outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100"><p id="password-help" class="mt-2 text-xs text-slate-500">Use at least 8 characters.</p></div><div><label for="confirm-password" class="text-sm font-medium">Confirm password</label><input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 text-sm outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100"></div><label class="flex gap-3 text-sm leading-relaxed text-slate-600"><input type="checkbox" required class="mt-0.5 h-4 w-4 shrink-0 rounded border-slate-300 text-blue-600 focus:ring-blue-500">I agree to the <a href="#" class="font-medium text-blue-600">Terms of Service</a> and <a href="#" class="font-medium text-blue-600">Privacy Policy</a>.</label><button type="submit" class="w-full rounded-xl bg-blue-600 px-4 py-3 text-sm font-semibold text-white shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-200">Create account</button></form></div></main></body></html>
