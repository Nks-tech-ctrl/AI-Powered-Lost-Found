<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 — Server Error — FindBack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#2563EB',
            'primary-dark': '#1D4ED8',
            navy: '#0F172A',
            indigo: '#4F46E5',
            cyan: '#06B6D4',
            'bg-main': '#F8FAFC',
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            heading: ['"Outfit"', 'sans-serif'],
          }
        }
      }
    };
  </script>
</head>
<body class="bg-bg-main text-navy font-sans min-h-screen flex flex-col justify-between antialiased selection:bg-blue-600 selection:text-white">

  <!-- Header -->
  <header class="w-full bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-primary to-indigo flex items-center justify-center text-white shadow-md shadow-blue-500/20">
          <i class="fa-solid fa-satellite-dish text-sm"></i>
        </div>
        <span class="text-xl font-extrabold font-heading text-navy">Find<span class="text-primary">Back</span></span>
      </a>

      <div class="flex items-center gap-3">
        <a href="/" class="text-xs font-semibold text-slate-600 hover:text-primary transition-colors">Home</a>
        <a href="/items/search/" class="text-xs font-semibold text-slate-600 hover:text-primary transition-colors">Catalog</a>
      </div>
    </div>
  </header>

  <!-- Error Card Content -->
  <main class="flex-1 flex items-center justify-center py-12 px-4 relative overflow-hidden">
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-rose-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="max-w-xl w-full text-center relative z-10 space-y-7">
      
      <!-- Visual Status Hub -->
      <div class="relative mx-auto w-28 h-28 flex items-center justify-center">
        <div class="absolute inset-0 rounded-full bg-rose-500/15 animate-ping opacity-60"></div>
        <div class="w-24 h-24 rounded-3xl bg-rose-50 text-rose-600 flex flex-col items-center justify-center shadow-lg border border-rose-200">
          <i class="fa-solid fa-server text-3xl"></i>
          <span class="text-[9px] uppercase tracking-wider font-extrabold text-rose-700 mt-1">500 Error</span>
        </div>
      </div>

      <!-- Heading & Text -->
      <div class="space-y-2.5">
        <h1 class="text-3xl sm:text-4xl font-black font-heading text-navy tracking-tight">
          System <span class="text-rose-600">Interruption</span>
        </h1>
        <p class="text-sm sm:text-base text-slate-600 max-w-md mx-auto leading-relaxed">
          An unexpected error occurred while processing your request. Our automated monitors have logged this event and our team is already on it.
        </p>
      </div>

      <!-- Quick Actions -->
      <div class="flex flex-wrap items-center justify-center gap-3 pt-2">
        <button onclick="window.location.reload();"
                class="px-5 py-2.5 bg-primary hover:bg-primary-dark text-white rounded-xl font-bold text-xs sm:text-sm shadow-md hover:shadow-lg transition-all inline-flex items-center gap-2">
          <i class="fa-solid fa-rotate-right text-xs"></i>
          <span>Reload Page</span>
        </button>

        <button onclick="window.history.length > 1 ? window.history.back() : window.location.href='/';"
                class="px-5 py-2.5 bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 rounded-xl font-bold text-xs sm:text-sm shadow-xs transition-all inline-flex items-center gap-2">
          <i class="fa-solid fa-arrow-left text-xs"></i>
          <span>Go Back</span>
        </button>

        <a href="/items/my-reports/"
           class="px-5 py-2.5 bg-white hover:bg-blue-50 border border-blue-200 text-primary rounded-xl font-bold text-xs sm:text-sm shadow-xs transition-all inline-flex items-center gap-2">
          <i class="fa-solid fa-list-check text-xs"></i>
          <span>My Reports</span>
        </a>
      </div>

      <!-- Diagnostic Status Badge -->
      <div class="pt-6">
        <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-100 border border-slate-200 text-[11px] text-slate-600 font-semibold">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>Core platform services operational</span>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400">
    FindBack Platform &copy; 2026 — AI-Powered Lost & Found Network
  </footer>

</body>
</html>
