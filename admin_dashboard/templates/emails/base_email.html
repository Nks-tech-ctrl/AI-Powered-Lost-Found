<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block subject %}{{ subject|default:"FindBack Notification" }}{% endblock %}</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }
    .wrapper {
      width: 100%;
      background-color: #f8fafc;
      padding: 30px 15px;
      box-sizing: border-box;
    }
    .container {
      max-width: 580px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .header {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      padding: 24px 30px;
      text-align: center;
    }
    .header h1 {
      color: #ffffff;
      font-size: 22px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.5px;
    }
    .header p {
      color: #bfdbfe;
      font-size: 13px;
      margin: 4px 0 0 0;
    }
    .content {
      padding: 32px 30px;
    }
    .content h2 {
      color: #0f172a;
      font-size: 18px;
      font-weight: 600;
      margin-top: 0;
      margin-bottom: 16px;
    }
    .content p {
      color: #334155;
      font-size: 15px;
      margin-bottom: 16px;
    }
    .btn {
      display: inline-block;
      background-color: #2563eb;
      color: #ffffff !important;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      margin: 20px 0;
      text-align: center;
    }
    .details-box {
      background-color: #f1f5f9;
      border-left: 4px solid #3b82f6;
      border-radius: 6px;
      padding: 16px;
      margin: 20px 0;
    }
    .details-box p {
      margin: 4px 0;
      font-size: 14px;
      color: #1e293b;
    }
    .footer {
      background-color: #f8fafc;
      border-top: 1px solid #e2e8f0;
      padding: 20px 30px;
      text-align: center;
      font-size: 12px;
      color: #64748b;
    }
    .footer a {
      color: #2563eb;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <div class="header">
        <h1>FindBack</h1>
        <p>AI-Powered Lost &amp; Found Platform</p>
      </div>
      <div class="content">
        {% block content %}{% endblock %}
      </div>
      <div class="footer">
        <p>This is an automated notification from FindBack. Please do not reply directly to this email.</p>
        <p>&copy; FindBack Platform. All rights reserved. <a href="{{ site_url }}">Visit Website</a></p>
      </div>
    </div>
  </div>
</body>
</html>
